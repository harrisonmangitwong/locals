name: Scrape new restaurants

# Data-only: finds and scrapes NYC restaurants not already in data/restaurants.csv,
# bounded discovery/detail/review requests; these are NOT a $5 monthly dollar cap.
# See SCRAPER_BUDGET.md. Does NOT run scoring or touch backend/data.csv.
# Check actual Apify billing before relying on the schedule unattended.

concurrency:
  group: monthly-restaurant-scrape
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 13 1 * *" # 1st of each month, 9am ET -- adjust to match your Apify billing cycle
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test request safeguards (no network)
        run: python -m unittest discover -s tests -p 'test_scraper_budget.py'

      - name: Scrape new restaurants
        env:
          MAX_DISCOVERY_SEARCH_TERMS: "3"
          MAX_DISCOVERY_PLACES_PER_SEARCH: "10"
          MAX_DISCOVERY_RESULTS_PER_RUN: "30"
          MAX_NEW_PLACES_PER_RUN: "5"
          MAX_REVIEWS_PER_NEW_PLACE: "10"
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python scrape_new_restaurants.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/restaurants.csv data/reviews.csv data/raw_apify_data.json
          if git diff --cached --quiet; then
            echo "No new restaurants this run."
          else
            git commit -m "Scrape: add new NYC restaurants"
            git push
          fi

